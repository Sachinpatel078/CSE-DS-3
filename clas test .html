<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Restaurant Menu</title>

    <style>
       
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
            color: #cbc1c1;
        }

       
        header {
            text-align: center;
            background-color: #e3dedc;
            color: white;
            padding: 20px 0;
        }

        .header-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 3px solid #da6f54;
        }

        
        nav {
            background-color: #9a1515;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        nav ul li {
            display: inline-block;
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            display: inline-block;
        }

        nav ul li a:hover {
            background-color: #4fd08b;
            border-radius: 5px;
        }

        
        section {
            padding: 30px;
            text-align: center;
        }

        h2 {
            color: #d5cecc;
            margin-bottom: 20px;
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 0 10px rgba(207, 203, 203, 0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #cd8770;
            color: white;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #cabdbd;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>

<body>
   
    <header>
        <img src="./header.jpg" alt="Restaurant Banner" class="header-img">
        <h1>Welcome to Tasty Bites</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <section>
        <h2>Our Menu</h2>
        <table>
            <tr>
                <th>Item</th>
                <th>Description</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Pizza</td>
                <td>Cheesy Margherita with herbs</td>
                <td>₹250</td>
            </tr>
            <tr>
                <td>Burger</td>
                <td>Grilled chicken with cheese</td>
                <td>₹180</td>
            </tr>
            <tr>
                <td>Pasta</td>
                <td>White sauce creamy pasta</td>
                <td>₹220</td>
            </tr>
        </table>
    </section>
</body>
</html>
