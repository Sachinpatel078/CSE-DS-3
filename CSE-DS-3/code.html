<!DOCTYPE html>
<html>
<head>
  <title>Simple Restaurant Menu</title>
  <style>
    table {
      border: 1px solid black;
      width: 50%;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
    th {
      background-color: lightgray;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Restaurant Menu</h2>
  <table>
    <tr>
      <th>Category</th>
      <th>Item</th>
      <th>Price</th>
    </tr>
    <tr>
      <td>Starters</td>
      <td>Spring Rolls</td>
      <td>₹100</td>
    </tr>
    <tr>
      <td>Main Course</td>
      <td>Chicken Curry</td>
      <td>₹250</td>
    </tr>
    <tr>
      <td>Desserts</td>
      <td>Chocolate Cake</td>
      <td>₹150</td>
    </tr>
  </table>
</body>
</html>
